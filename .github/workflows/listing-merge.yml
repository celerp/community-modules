name: Merge listing

# Runs from the default branch after "Validate catalog" finishes for a pull
# request. It never checks out or runs pull request content: it runs this
# repository's merge_gate.py, which reads the check's result and the pull
# request through the GitHub API and merges only a clean, current pass.
on:
  workflow_run:
    workflows: [Validate catalog]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

# One at a time, so each merge is checked against the catalog it lands on.
concurrency:
  group: listing-merge
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 scripts/merge_gate.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
