name: Merge listing

# Runs from the default branch after "Listing check" finishes for a pull
# request, and hourly. It never checks out or runs pull request content: it
# runs this repository's merge_gate.py, which reads the check's result and the
# pull request through the GitHub API and merges only a clean, current pass.
# Every run handles each open pull request whose latest check has no outcome yet.
on:
  workflow_run:
    workflows: [Listing check]
    types: [completed]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

# One at a time, so each merge is checked against the catalog it lands on.
# GitHub keeps only the newest waiting run; since every run handles all open
# pull requests, the waiting runs it replaces are covered by it.
concurrency:
  group: listing-merge
  cancel-in-progress: false

jobs:
  merge:
    if: github.event_name == 'schedule' || github.event.workflow_run.event == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 scripts/merge_gate.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
