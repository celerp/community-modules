name: Validate catalog

# Runs this repository's tests and validates index.json (schema + policy rules).
# Read-only. Listing pull requests are checked by the "Listing check" workflow,
# and the README table is rebuilt after each push to main by "Rebuild README".
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --quiet --require-hashes -r scripts/requirements.txt
      - run: python3 scripts/validate_index.py --selftest
      - run: python3 -m unittest discover -s tests -t tests
      - run: python3 scripts/validate_index.py
