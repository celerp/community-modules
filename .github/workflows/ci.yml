name: Validate catalog

# Runs this repository's tests, validates index.json (schema + policy rules) and
# checks the README table is generated from it. Read-only. Listing pull requests
# are checked by the "Listing check" workflow.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: pip install --quiet "jsonschema>=4"
      - run: python3 scripts/validate_index.py --selftest
      - run: python3 -m unittest discover -s tests -t tests
      - run: python3 scripts/validate_index.py
      - run: python3 scripts/gen_readme.py --check
